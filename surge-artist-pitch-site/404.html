<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIMMERSATT — Not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rock+3D&family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    .nf { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
    .nf__mark { width: clamp(40px, 5vw, 60px); margin-bottom: clamp(1.5rem, 4vw, 2.5rem); }
    .nf__code {
      font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
      letter-spacing: 0.02em; line-height: 0.88; font-size: clamp(4rem, 18vw, 14rem);
    }
    .nf__line { margin-top: clamp(1rem, 2.5vw, 1.75rem); font-size: var(--text-sub); color: var(--muted); max-width: 42ch; }
    .nf__line em { color: var(--accent); font-style: normal; }
    .nf__back {
      margin-top: clamp(2rem, 4vw, 3rem); font-size: var(--text-label);
      letter-spacing: 0.16em; text-transform: uppercase; position: relative; width: max-content;
    }
    .nf__back::after {
      content: ""; position: absolute; left: 0; bottom: -4px; width: 100%; height: 1px;
      background: var(--accent); transform: scaleX(0); transform-origin: right;
      transition: transform var(--dur-ui) var(--ease-spring);
    }
    .nf__back:hover::after { transform: scaleX(1); transform-origin: left; }
  </style>
</head>
<body>
  <main class="nf shell">
    <img class="nf__mark" src="assets/logo.svg" alt="Nimmersatt" />
    <h1 class="nf__code">404</h1>
    <p class="nf__line">This page never got finished — fitting, for a studio called <em>never full, never finished</em>. The work is back home.</p>
    <a class="nf__back" href="/index.html">← Back to Nimmersatt</a>
  </main>
</body>
</html>
